<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEER G1 — Play in your browser</title>
    <!-- Enable cross-origin isolation (needed for the MuJoCo pthread WASM) on
         static hosts like GitHub Pages that can't set COOP/COEP response headers.
         No-op when the server already sends the headers (e.g. the Vite dev server). -->
    <script src="./coi-serviceworker.js"></script>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1016; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }

      #overlay {
        position: fixed; top: 14px; left: 14px;
        font: 13px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: #e6e9ef; background: rgba(16, 19, 27, 0.74);
        border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 12px;
        padding: 14px 16px; max-width: 300px;
        backdrop-filter: blur(8px); user-select: none;
      }
      #overlay h1 { margin: 0 0 2px; font-size: 15px; font-weight: 650; letter-spacing: .2px; }
      #overlay h1 .c { color: #ff5b5b; }
      #overlay .sub { color: #9aa3b2; font-size: 12px; margin-bottom: 10px; }
      .keys { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 8px 0 2px; }
      .keys kbd {
        font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #262b38; border: 1px solid #39404f; border-bottom-width: 2px;
        border-radius: 5px; padding: 3px 6px; color: #dbe0ea; white-space: nowrap; justify-self: start;
      }
      .keys span { color: #b9c0cd; align-self: center; }
      #hud {
        margin-top: 10px; padding-top: 9px; border-top: 1px solid rgba(255,255,255,.08);
        color: #8b93a2; font: 11px/1.5 ui-monospace, Menlo, monospace; display: flex; gap: 12px;
      }
      #hud b { color: #cdd3de; font-weight: 600; }
      .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
      .row button {
        font: 12px system-ui, sans-serif; color: #e6e9ef; background: #2a3140;
        border: 1px solid #3a4252; border-radius: 7px; padding: 5px 11px; cursor: pointer;
      }
      .row button:hover { background: #333c4d; }
      .row label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #b9c0cd; }
      .hint { color: #7f8794; font-size: 11px; margin-top: 9px; }

      #status {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        font: 15px system-ui, sans-serif; color: #cfd4dd; background: #0e1016;
        z-index: 10; text-align: center; padding: 20px;
      }
      #status.hidden { display: none; }
      #status.error { color: #ff8f8f; white-space: pre-wrap; }
      #status .spin {
        width: 34px; height: 34px; margin: 0 auto 14px; border-radius: 50%;
        border: 3px solid #2a2f3a; border-top-color: #ff5b5b; animation: sp 0.9s linear infinite;
      }
      @keyframes sp { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="overlay" hidden>
      <h1><span class="c">CEER</span> G1 &mdash; live sim</h1>
      <div class="sub">Drive the humanoid with your keyboard.</div>

      <div class="keys">
        <kbd>W A S D</kbd><span>walk (hold direction)</span>
        <kbd>Q E</kbd><span>turn left / right</span>
        <kbd>Space</kbd><span>stop</span>
        <kbd>I K</kbd><span>hands forward / back</span>
        <kbd>J L</kbd><span>hands apart / together</span>
        <kbd>U O</kbd><span>hands up / down</span>
        <kbd>R</kbd><span>reset</span>
      </div>

      <div class="row">
        <button id="reset-btn">Reset</button>
        <label><input type="checkbox" id="step-toggle" checked /> Run</label>
      </div>

      <div id="hud">
        <span>root&nbsp;z <b id="hud-z">—</b></span>
        <span>fps <b id="hud-fps">—</b></span>
      </div>

      <div class="hint">Drag to orbit &middot; scroll to zoom &middot; right-drag to pan</div>
    </div>

    <div id="status"><div class="spin"></div>Loading MuJoCo runtime&hellip;</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
